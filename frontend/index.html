<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TaskFlow | Azure Capstone</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { display: flex; min-height: 100vh; background: #f4f5fb; color: #1e1b3a; }

  /* Sidebar */
  .sidebar { width: 76px; background: linear-gradient(180deg,#5b21b6,#7c3aed); display: flex; flex-direction: column; align-items: center; padding: 24px 0; gap: 28px; }
  .sidebar .logo { font-size: 26px; }
  .sidebar .nav-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: rgba(255,255,255,0.75); cursor: default; }
  .sidebar .nav-icon.active { background: white; color: #7c3aed; }

  /* Main */
  .main { flex: 1; padding: 28px 36px; max-width: 1100px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
  .topbar h1 { font-size: 22px; font-weight: 800; }
  .topbar p { font-size: 13px; color: #6b7280; margin-top: 2px; }
  .auth { display: flex; align-items: center; gap: 10px; }
  #userChip { display: none; align-items: center; gap: 8px; background: white; padding: 8px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  #userChip .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
  button { cursor: pointer; border: none; font-family: inherit; }
  #loginBtn { background: linear-gradient(135deg,#7c3aed,#a855f7); color: white; padding: 11px 22px; border-radius: 10px; font-weight: 700; font-size: 13px; box-shadow: 0 4px 14px rgba(124,58,237,0.3); }
  #logoutBtn { display: none; background: #f1f1f6; color: #4b5563; padding: 11px 18px; border-radius: 10px; font-weight: 700; font-size: 13px; }

  /* Hero */
  .hero { background: linear-gradient(120deg,#7c3aed,#a855f7 60%,#ec4899); border-radius: 20px; padding: 28px 30px; color: white; margin-bottom: 24px; box-shadow: 0 8px 26px rgba(124,58,237,0.25); }
  .hero h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .hero p { font-size: 13px; opacity: 0.9; margin-bottom: 16px; }
  .hero .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero input, .hero textarea { flex: 1; min-width: 160px; padding: 11px 14px; border: none; border-radius: 10px; font-size: 13px; }
  .hero button.create { background: white; color: #7c3aed; padding: 11px 20px; border-radius: 10px; font-weight: 800; font-size: 13px; }
  .hero .msg { font-size: 12px; margin-top: 10px; font-weight: 600; }

  /* Cards grid */
  .section-title { font-size: 14px; font-weight: 800; color: #4b5563; margin: 6px 0 12px; text-transform: uppercase; letter-spacing: 0.4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 16px; margin-bottom: 26px; }
  .proj-card { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 2px 10px rgba(15,23,42,0.06); border: 1px solid #eef0f6; cursor: pointer; transition: 0.15s; position: relative; }
  .proj-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(124,58,237,0.15); }
  .proj-card.selected { border: 2px solid #a855f7; }
  .proj-card h3 { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
  .proj-card p { font-size: 12px; color: #6b7280; margin-bottom: 10px; min-height: 16px; }
  .proj-card .manager { font-size: 11px; color: #9333ea; font-weight: 700; background: #f3e8ff; display: inline-block; padding: 3px 10px; border-radius: 20px; margin-bottom: 12px; }
  .proj-card .icon-row { display: flex; gap: 8px; position: absolute; top: 14px; right: 14px; }
  .icon-btn { width: 28px; height: 28px; border-radius: 8px; background: #f4f5fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6b7280; }
  .icon-btn.danger:hover { background: #fee2e2; color: #dc2626; }
  .icon-btn.edit:hover { background: #ede9fe; color: #7c3aed; }
  .empty { color: #9ca3af; font-size: 13px; text-align: center; padding: 26px; background: white; border-radius: 14px; border: 1px dashed #e2e8f0; }

  /* Tasks panel */
  .task-panel { background: white; border-radius: 18px; padding: 22px; box-shadow: 0 2px 12px rgba(15,23,42,0.06); border: 1px solid #eef0f6; }
  .task-panel h2 { font-size: 16px; font-weight: 800; margin-bottom: 14px; }
  .task-add-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .task-add-row input { flex: 1; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 13px; }
  .task-add-row button { background: linear-gradient(135deg,#7c3aed,#a855f7); color: white; padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 13px; }
  .task-item { background: #faf9ff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid #7c3aed; }
  .task-item.done { border-left-color: #22c55e; opacity: 0.75; }
  .task-item .row { display: flex; justify-content: space-between; align-items: center; }
  .task-item h4 { font-size: 13.5px; font-weight: 700; }
  .badge { font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 800; text-transform: uppercase; }
  .badge.todo { background: #fef3c7; color: #92400e; }
  .badge.done { background: #dcfce7; color: #166534; }
  .task-actions { display: flex; gap: 6px; }
  .mini-btn { font-size: 11px; padding: 5px 10px; border-radius: 7px; font-weight: 700; background: #eef0f6; color: #4b5563; }
  .mini-btn.danger { background: #fee2e2; color: #dc2626; }
  .comments { margin-top: 10px; }
  .comment { background: white; border: 1px solid #eef0f6; border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 12px; }
  .comment .author { font-weight: 800; color: #7c3aed; font-size: 10.5px; }
  .comment-row { display: flex; gap: 8px; margin-top: 8px; }
  .comment-row input { flex: 1; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 12px; }
  .comment-row button { background: #ede9fe; color: #7c3aed; padding: 8px 14px; border-radius: 8px; font-size: 11px; font-weight: 800; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">🔷</div>
  <div class="nav-icon active">🏠</div>
  <div class="nav-icon">✅</div>
  <div class="nav-icon">💬</div>
  <div class="nav-icon">⚙️</div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <h1>TaskFlow Dashboard</h1>
      <p>Azure Capstone — Secure Task &amp; Project Manager</p>
    </div>
    <div class="auth">
      <div id="userChip"><span class="dot"></span><span id="userName"></span></div>
      <button id="loginBtn">Login with Microsoft</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="hero">
    <h2>Create a new project</h2>
    <p>Boards, tasks and comments — organise your work in one place</p>
    <div class="form-row">
      <input id="boardName" placeholder="Project name" />
      <input id="boardManager" placeholder="Manager name" />
    </div>
    <div class="form-row" style="margin-top:10px;">
      <textarea id="boardDesc" placeholder="Description" rows="1"></textarea>
      <button class="create" id="createBtn">+ Create Project</button>
    </div>
    <div class="msg" id="status"></div>
  </div>

  <div class="section-title">Your Projects</div>
  <div id="boards" class="grid"><div class="empty">Login pannunga first</div></div>

  <div id="taskSection" style="display:none;">
    <div class="section-title">Tasks — <span id="selectedBoardName"></span></div>
    <div class="task-panel">
      <div class="task-add-row">
        <input id="taskName" placeholder="New task name..." />
        <button id="addTaskBtn">Add Task</button>
      </div>
      <div class="msg" id="taskStatus"></div>
      <div id="taskList"></div>
    </div>
  </div>
</div>

<script>
  const REDIRECT_URI = window.location.origin;
  const msalConfig = {
    auth: {
      clientId: "01ead7c4-a482-4307-a6ed-b2592b820444",
      authority: "https://login.microsoftonline.com/b8a38f66-d491-4f70-a5b1-ed0072b1065d",
      redirectUri: REDIRECT_URI
    }
  };
  const msalInstance = new msal.PublicClientApplication(msalConfig);
  const API = "https://capstone-12662.centralindia.cloudapp.azure.com/api";
  const apiScope = "api://889db145-f87e-4b40-b150-5c025330f597/access";
  let currentBoards = [];
  let selectedBoardId = null;

  async function init() {
    await msalInstance.initialize();
    const response = await msalInstance.handleRedirectPromise();
    if (response) { msalInstance.setActiveAccount(response.account); onLoggedIn(); }
    else if (msalInstance.getActiveAccount()) { onLoggedIn(); }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("logoutBtn").addEventListener("click", () => msalInstance.logoutRedirect());
    document.getElementById("createBtn").addEventListener("click", createBoard);
    document.getElementById("addTaskBtn").addEventListener("click", addTask);

    // Event delegation: boards grid clicks
    document.getElementById("boards").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      const owner = btn.dataset.owner;
      if (action === "select") selectBoard(id, btn.dataset.name);
      if (action === "edit") { e.stopPropagation(); editBoard(id, owner); }
      if (action === "delete") { e.stopPropagation(); deleteBoard(id, owner); }
    });

    // Event delegation: task list clicks
    document.getElementById("taskList").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      if (action === "toggle") toggleTask(id);
      if (action === "delete-task") deleteTask(id);
      if (action === "comment") addComment(id);
    });
  }

  function onLoggedIn() {
    const account = msalInstance.getActiveAccount();
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("logoutBtn").style.display = "inline-block";
    document.getElementById("userChip").style.display = "flex";
    document.getElementById("userName").innerText = account?.username || "Signed in";
    loadBoards();
  }

  async function login() {
    try { await msalInstance.loginRedirect({ scopes: [apiScope] }); }
    catch (err) { setMsg("status", "Login error: " + err, true); }
  }

  async function getToken() {
    const account = msalInstance.getActiveAccount();
    const t = await msalInstance.acquireTokenSilent({ scopes: [apiScope], account });
    return t.accessToken;
  }

  function setMsg(id, text, isError) {
    const el = document.getElementById(id);
    el.innerText = text;
    el.style.color = isError ? "#dc2626" : "#d1fae5";
  }

  function esc(s) { return (s || "").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  // ---------- BOARDS ----------
  async function loadBoards() {
    const el = document.getElementById("boards");
    el.innerHTML = '<div class="empty">Loading...</div>';
    try {
      const token = await getToken();
      const res = await fetch(`${API}/boards`, { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      currentBoards = data;
      if (!data.length) { el.innerHTML = '<div class="empty">No projects yet. Create one above.</div>'; return; }
      el.innerHTML = data.map(b => `
        <div class="proj-card ${b.id === selectedBoardId ? 'selected' : ''}" data-action="select" data-id="${b.id}" data-name="${esc(b.name)}">
          <div class="icon-row">
            <div class="icon-btn edit" data-action="edit" data-id="${b.id}" data-owner="${b.ownerId}">✎</div>
            <div class="icon-btn danger" data-action="delete" data-id="${b.id}" data-owner="${b.ownerId}">🗑</div>
          </div>
          <h3>${esc(b.name) || "Untitled"}</h3>
          <p>${esc(b.description) || "No description"}</p>
          <span class="manager">👤 ${esc(b.manager) || "Unassigned"}</span>
        </div>
      `).join("");
    } catch (err) { el.innerHTML = '<div class="empty">Error: ' + err + '</div>'; }
  }

  async function createBoard() {
    const name = document.getElementById("boardName").value.trim();
    const manager = document.getElementById("boardManager").value.trim();
    const description = document.getElementById("boardDesc").value.trim();
    if (!name) { setMsg("status", "Project name venum.", true); return; }
    setMsg("status", "Creating...", false);
    try {
      const token = await getToken();
      const res = await fetch(`${API}/boards`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ id: Date.now().toString(), ownerId: "user1", name, manager, description })
      });
      if (!res.ok) throw new Error(`Backend returned ${res.status}`);
      setMsg("status", "Project created!", false);
      document.getElementById("boardName").value = "";
      document.getElementById("boardManager").value = "";
      document.getElementById("boardDesc").value = "";
      loadBoards();
    } catch (err) { setMsg("status", "Error: " + err, true); }
  }

  async function editBoard(id, ownerId) {
    const board = currentBoards.find(b => b.id === id);
    const newName = prompt("Edit project name:", board ? board.name : "");
    if (newName === null || !newName.trim()) return;
    try {
      const token = await getToken();
      const res = await fetch(`${API}/boards/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ ownerId, name: newName.trim() })
      });
      if (!res.ok) throw new Error(`Backend returned ${res.status}`);
      loadBoards();
    } catch (err) { alert("Error updating project: " + err); }
  }

  async function deleteBoard(id, ownerId) {
    if (!confirm("Delete this project?")) return;
    try {
      const token = await getToken();
      const res = await fetch(`${API}/boards/${id}?ownerId=${ownerId}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok && res.status !== 204) throw new Error(`Backend returned ${res.status}`);
      if (selectedBoardId === id) { selectedBoardId = null; document.getElementById("taskSection").style.display = "none"; }
      loadBoards();
    } catch (err) { alert("Error deleting project: " + err); }
  }

  function selectBoard(id, name) {
    selectedBoardId = id;
    document.getElementById("selectedBoardName").innerText = name;
    document.getElementById("taskSection").style.display = "block";
    loadBoards();
    loadTasks();
  }

  // ---------- TASKS ----------
  async function loadTasks() {
    if (!selectedBoardId) return;
    const el = document.getElementById("taskList");
    el.innerHTML = '<div class="empty">Loading tasks...</div>';
    try {
      const token = await getToken();
      const res = await fetch(`${API}/boards/${selectedBoardId}/tasks`, { headers: { Authorization: `Bearer ${token}` } });
      const tasks = await res.json();
      if (!tasks.length) { el.innerHTML = '<div class="empty">No tasks yet.</div>'; return; }
      el.innerHTML = tasks.map(t => `
        <div class="task-item ${t.status === 'done' ? 'done' : ''}">
          <div class="row">
            <div>
              <h4>${esc(t.name)}</h4>
              <span class="badge ${t.status === 'done' ? 'done' : 'todo'}">${t.status || 'todo'}</span>
            </div>
            <div class="task-actions">
              <button class="mini-btn" data-action="toggle" data-id="${t.id}">${t.status === 'done' ? 'Mark Todo' : 'Mark Done'}</button>
              <button class="mini-btn danger" data-action="delete-task" data-id="${t.id}">Delete</button>
            </div>
          </div>
          <div class="comments" id="comments-${t.id}"></div>
          <div class="comment-row">
            <input id="commentInput-${t.id}" placeholder="Add a comment..." />
            <button data-action="comment" data-id="${t.id}">Post</button>
          </div>
        </div>
      `).join("");
      tasks.forEach(t => loadComments(t.id));
    } catch (err) { el.innerHTML = '<div class="empty">Error: ' + err + '</div>'; }
  }

  async function addTask() {
    const name = document.getElementById("taskName").value.trim();
    if (!selectedBoardId || !name) { setMsg("taskStatus", "Task name venum.", true); return; }
    setMsg("taskStatus", "Adding...", false);
    try {
      const token = await getToken();
      const res = await fetch(`${API}/boards/${selectedBoardId}/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ id: Date.now().toString(), name })
      });
      if (!res.ok) throw new Error(`Backend returned ${res.status}`);
      setMsg("taskStatus", "", false);
      document.getElementById("taskName").value = "";
      loadTasks();
    } catch (err) { setMsg("taskStatus", "Error: " + err, true); }
  }

  async function toggleTask(id) {
    try {
      const token = await getToken();
      const res = await fetch(`${API}/boards/${selectedBoardId}/tasks`, { headers: { Authorization: `Bearer ${token}` } });
      const tasks = await res.json();
      const t = tasks.find(x => x.id === id);
      const newStatus = (t && t.status === "done") ? "todo" : "done";
      const r2 = await fetch(`${API}/tasks/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ boardId: selectedBoardId, status: newStatus })
      });
      if (!r2.ok) throw new Error(`Backend returned ${r2.status}`);
      loadTasks();
    } catch (err) { alert("Error updating task: " + err); }
  }

  async function deleteTask(id) {
    if (!confirm("Delete this task?")) return;
    try {
      const token = await getToken();
      const res = await fetch(`${API}/tasks/${id}?boardId=${selectedBoardId}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok && res.status !== 204) throw new Error(`Backend returned ${res.status}`);
      loadTasks();
    } catch (err) { alert("Error deleting task: " + err); }
  }

  // ---------- COMMENTS ----------
  async function loadComments(taskId) {
    const el = document.getElementById(`comments-${taskId}`);
    if (!el) return;
    try {
      const token = await getToken();
      const res = await fetch(`${API}/tasks/${taskId}/comments`, { headers: { Authorization: `Bearer ${token}` } });
      const comments = await res.json();
      el.innerHTML = comments.map(c => `<div class="comment"><div class="author">${esc(c.author) || 'User'}</div>${esc(c.text)}</div>`).join("");
    } catch (err) { /* silent */ }
  }

  async function addComment(taskId) {
    const input = document.getElementById(`commentInput-${taskId}`);
    const text = input.value.trim();
    if (!text) return;
    try {
      const token = await getToken();
      const account = msalInstance.getActiveAccount();
      await fetch(`${API}/tasks/${taskId}/comments`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ id: Date.now().toString(), text, author: account?.username || "User" })
      });
      input.value = "";
      loadComments(taskId);
    } catch (err) { alert("Error adding comment: " + err); }
  }

  init();
</script>
</body>
</html>
