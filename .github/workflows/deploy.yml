name: CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev

      - name: Zip backend
        run: |
          cd backend
          zip -r ../backend.zip . -x "*.env*"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-capstone-2898
          package: backend.zip

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload frontend to Storage
        run: |
          az storage blob upload-batch \
            --account-name stcapstone3912 \
            -d '$web' \
            -s frontend \
            --auth-mode login \
            --overwrite
