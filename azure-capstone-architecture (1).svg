<svg width="1000" height="1250" viewBox="0 0 1000 1250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1000" height="1250" fill="#ffffff"/>
  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#222">Azure Capstone Project – Architecture Diagram</text>

  <!-- CI/CD column -->
  <rect x="60" y="80" width="220" height="55" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="170" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">GitHub</text>
  <text x="170" y="120" text-anchor="middle" font-size="12" fill="#185FA5">CI / CD</text>

  <rect x="60" y="175" width="220" height="55" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="170" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">Azure Deployment</text>
  <text x="170" y="215" text-anchor="middle" font-size="12" fill="#185FA5">Main flow</text>

  <line x1="170" y1="135" x2="170" y2="173" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- deploy arrow down to right side flow -->
  <path d="M280 202 H360 V330" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="330" y="270" font-size="11" fill="#777">deploys</text>

  <!-- User -->
  <rect x="700" y="80" width="180" height="55" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="790" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">User</text>

  <!-- Storage -->
  <rect x="660" y="175" width="260" height="65" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="790" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Azure Storage</text>
  <text x="790" y="215" text-anchor="middle" font-size="12" fill="#3C3489">Static Website – Frontend</text>

  <line x1="790" y1="135" x2="790" y2="173" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App Gateway -->
  <rect x="660" y="280" width="260" height="60" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="790" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Application Gateway</text>
  <text x="790" y="320" text-anchor="middle" font-size="12" fill="#085041">HTTPS / Routing / WAF</text>

  <line x1="790" y1="240" x2="790" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="815" y="260" font-size="11" fill="#777">HTTPS</text>

  <!-- VNet container -->
  <rect x="620" y="390" width="340" height="365" rx="14" fill="#FAECE7" stroke="#D85A30" stroke-dasharray="6 4"/>
  <text x="645" y="415" font-size="14" font-weight="600" fill="#4A1B0C">Azure VNet (10.0.0.0/16)</text>
  <text x="645" y="430" font-size="10" fill="#712B13">AppSubnet (App Service)  ·  DataSubnet (Cosmos DB Private Endpoint)</text>

  <rect x="650" y="435" width="280" height="60" rx="8" fill="#F5C4B3" stroke="#D85A30"/>
  <text x="790" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">App Service</text>
  <text x="790" y="475" text-anchor="middle" font-size="12" fill="#712B13">Backend</text>

  <rect x="650" y="530" width="280" height="60" rx="8" fill="#F5C4B3" stroke="#D85A30"/>
  <text x="790" y="553" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Private Endpoint</text>

  <line x1="790" y1="340" x2="790" y2="433" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="790" y1="495" x2="790" y2="528" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cosmos DB -->
  <rect x="660" y="670" width="260" height="65" rx="8" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="790" y="693" text-anchor="middle" font-size="13" font-weight="600" fill="#501313">Cosmos DB</text>
  <text x="790" y="710" text-anchor="middle" font-size="12" fill="#791F1F">Public Access: Disabled</text>

  <line x1="790" y1="630" x2="790" y2="668" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- User -> Entra ID login -->
  <path d="M700 107 H460 V412 H302" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="470" y="398" font-size="11" fill="#777">Login</text>

  <!-- Entra ID / Authentication -->
  <rect x="60" y="435" width="240" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="180" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="#412402">Microsoft Entra ID</text>
  <text x="180" y="475" text-anchor="middle" font-size="12" fill="#854F0B">Authentication</text>

  <rect x="60" y="530" width="240" height="55" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="180" y="562" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Application</text>

  <line x1="180" y1="495" x2="180" y2="528" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M300 555 H620" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="400" y="545" font-size="11" fill="#777">authenticates</text>

  <!-- App Insights -->
  <rect x="60" y="670" width="240" height="65" rx="8" fill="#FBEAF0" stroke="#D4537E"/>
  <text x="180" y="693" text-anchor="middle" font-size="13" font-weight="600" fill="#4B1528">Application Insights</text>
  <text x="180" y="710" text-anchor="middle" font-size="12" fill="#993556">Monitoring + Alerts</text>

  <path d="M650 465 H180 V668" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="420" y="455" font-size="11" fill="#777">Monitoring</text>

  <!-- Legend -->
  <text x="60" y="800" font-size="12" fill="#555">Solid arrows = data / request flow. Dashed arrows = deploy, auth, login, or monitoring paths.</text>
</svg>
